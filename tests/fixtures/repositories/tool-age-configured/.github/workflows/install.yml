name: Fixture
on: push
env:
  PIP_UPLOADED_PRIOR_TO: P7D
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install sample
      - env:
          PIP_UPLOADED_PRIOR_TO: P0D
        run: pip install --uploaded-prior-to=P7D sample
  local-config:
    runs-on: ubuntu-latest
    env:
      PIP_UPLOADED_PRIOR_TO: P7D
    steps:
      - run: PIP_CONFIG_FILE=config/pip.conf pip install sample
